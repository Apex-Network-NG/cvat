server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/(api/|static/|admin(?:/|$)|django-rq(?:/|$)) {
        set $cvat_backend cvat_server;
        proxy_pass http://$cvat_backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /analytics {
        return 301 /analytics/;
    }

    location /analytics/ {
        auth_request /_cvat_analytics_auth;

        rewrite ^/analytics/(.*)$ /$1 break;

        set $cvat_grafana cvat_grafana;
        proxy_pass http://$cvat_grafana:3000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /_cvat_analytics_auth {
        internal;

        set $cvat_backend cvat_server;
        proxy_pass http://$cvat_backend:8080/analytics;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        set $cvat_frontend cvat_ui;
        proxy_pass http://$cvat_frontend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
