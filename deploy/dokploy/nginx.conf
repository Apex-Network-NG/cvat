server {
    listen 80;
    server_name _;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location ~ ^/(api/|static/|admin(?:/|$)|django-rq(?:/|$)) {
        proxy_pass http://cvat_server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /analytics { return 301 /analytics/; }
    location /analytics/ {
        auth_request /_cvat_analytics_auth;
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_pass http://cvat_grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /_cvat_analytics_auth {
        internal;
        proxy_pass http://cvat_server:8080/analytics;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        proxy_pass http://cvat_ui:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
